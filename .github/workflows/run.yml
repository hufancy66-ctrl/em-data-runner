name: empirical-model-run
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          pip install pandas numpy scipy statsmodels requests openpyxl matplotlib
      - name: Run empirical pipeline
        run: python ci_analysis.py
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: empirical-model-outputs
          path: outputs
