name: e4-native-r-repair
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: |
          pip install pandas statsmodels requests
      - name: Extract ILOSTAT E4 with native R
        run: Rscript extract_e4.R
      - name: Estimate E4 with country/year fixed effects
        run: python estimate_e4_from_agg.py
      - name: Upload E4 outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-native-r-outputs
          path: outputs_e4_r
