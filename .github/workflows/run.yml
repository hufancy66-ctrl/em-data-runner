name: e4-dictionary-repair
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: |
          pip install pandas statsmodels requests
      - name: Extract ILOSTAT E4 using official classification dictionaries
        run: Rscript extract_e4_v2.R
      - name: Estimate E4 with country/year fixed effects
        run: python estimate_e4_v2.py
      - name: Upload E4 outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-dictionary-outputs
          path: outputs_e4_r2
