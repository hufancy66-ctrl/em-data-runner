name: e4-current-rds-repair
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          pip install pandas numpy scipy statsmodels requests pyreadr
      - name: Run current ILOSTAT RDS E4 repair
        run: python repair_e4_v3.py
      - name: Upload E4 outputs
        uses: actions/upload-artifact@v4
        with:
          name: e4-current-rds-outputs
          path: outputs_e4_v3
