name: empirical-model-repair
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          pip install pandas numpy scipy statsmodels requests pyreadr
      - name: Run E1/E4 repair diagnostics
        run: python repair_e1_e4.py
      - name: Upload repair outputs
        uses: actions/upload-artifact@v4
        with:
          name: empirical-model-repair-outputs
          path: outputs_repair
